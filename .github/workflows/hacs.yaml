name: HACS

# Scheduled for the same reason as hassfest.yaml, and one more: hacs/action
# evaluates HACS's current publishing requirements *and* live GitHub state --
# description, topics, issues enabled, releases present. Someone editing
# repository settings breaks it with no commit at all, which no push-triggered
# workflow would ever notice.
on:
  push:
    # `main` only, matching ci.yaml -- see hassfest.yaml for why, and for why the
    # tag exclusion is spelled with `branches` rather than `tags-ignore`.
    branches: [main]
  pull_request:
  schedule:
    - cron: '10 3 * * 1' # Mondays at 03:10 UTC
  workflow_dispatch:
  workflow_call: # release.yaml gates the publish on this

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # HACS documents this as `@main`, and its newest tagged release is 22.5.0
      # from 2022. The SHA below is main as of 2026-06-08, pinned because
      # `zizmor --pedantic` requires it and Dependabot maintains it. As with
      # hassfest, the pin does not freeze the rules: the action runs
      # docker://ghcr.io/hacs/action:main, pulled at run time.
      #
      # No `ignore:` list. Every check should pass; one that cannot is a fact
      # worth seeing rather than one to suppress.
      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
