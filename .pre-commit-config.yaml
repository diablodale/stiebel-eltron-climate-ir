# Hooks are run by prek, a drop-in replacement for pre-commit. Install the git
# shims once per clone -- naming every type, because prek has been reported to wire
# only `pre-commit` when left to read default_install_hook_types:
#
#   uv run prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
#
# These hooks are the local half, and they are there to catch a mistake in the second
# it is made. The enforcement is CI and the ruleset on main, neither of which can be
# reached from a shell here.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      # .env holds a Home Assistant long-lived access token and is gitignored. This
      # is what catches the day that gitignore is bypassed.
      - id: gitleaks
        # Duplicates flags the pinned entry already passes. Deliberate: stating them
        # here pins the behaviour even if upstream drops them from its entry.
        args: ['--redact', '--verbose']
        stages: [pre-commit]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.23.1
    hooks:
      # Audits GitHub Actions workflows. Its own `files` pattern scopes it to
      # .github/workflows, dependabot.yml and action.yml, so it stays inert until
      # those exist.
      - id: zizmor
        args: ['--pedantic']
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # Lint before format, as astral-sh documents for --fix.
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: fix-byte-order-marker
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
        # 134 lines of the ACP 35 protocol document end in a single trailing space:
        # verbatim ESPHome capture logs, the evidence the protocol was derived from.
        # --markdown-linebreak-ext preserves a two-space line break, not a one-space
        # one, so only an exclude saves them. Anchored on the filename rather than
        # its directory, so moving the file does not disarm this.
        exclude: Stiebel Eltron air conditioner ACP 35\.md$
        stages: [pre-commit]
      - id: check-json
        # VS Code reads its own files as JSONC and the comments in them explain
        # non-obvious settings, which is worth more than a syntax check on two
        # files whose parser accepts them.
        exclude: ^\.vscode/
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]

  - repo: local
    hooks:
      # The tools below run under `uv run --script`, so uv reads the PEP 723 block
      # in each and builds an environment from it -- no project, no dependencies,
      # just an interpreter satisfying `>=3.11`.
      #
      # `--no-python-downloads` keeps that from becoming a download. Without it uv
      # is entitled to fetch an interpreter when it finds none, which would turn a
      # git hook into a network operation on a machine that happens to be missing
      # one. With it, uv uses any interpreter already present and otherwise stops
      # with "No interpreter found for Python >=3.11", which is the useful answer.
      # Not `--no-managed-python`: that refuses uv's own interpreters, and on a
      # machine where those are the only ones it would break a working hook.
      #
      # Signing is required. Neither local check verifies a signature -- this clone
      # points gpg.program at the Windows GnuPG, which cannot open the Linux temp
      # path `git verify-commit` hands it. See tools/check_signing.py.
      - id: signing-configured
        name: Commit signing is configured
        stages: [pre-commit]
        language: system
        entry: uv run --no-python-downloads --script tools/check_signing.py config
        pass_filenames: false
        always_run: true

      - id: commitizen
        name: Conventional commit message
        stages: [commit-msg]
        language: system
        entry: uv run cz check --allow-abort --commit-msg-file

      # `cz bump` writes both files together, so they can only disagree after an
      # edit by hand -- and nothing else notices until a tag is pushed or a release
      # runs. Scoped by `files` rather than `always_run`, so it runs when one of the
      # two changes and stays out of the way otherwise.
      - id: versions-agree
        name: pyproject and manifest.json agree on the version
        stages: [pre-commit]
        language: system
        entry: uv run --no-python-downloads --script tools/check_versions.py files
        files: ^(pyproject\.toml|custom_components/stiebel_eltron_ir/manifest\.json)$
        pass_filenames: false

      # Home Assistant reads the translation and hassfest reads the source, so
      # editing one alone fails nothing and shows the wrong text. Scoped the same
      # way as the version check: it runs when one of the two moves.
      - id: strings-agree
        name: strings.json and the English translation agree
        stages: [pre-commit]
        language: system
        entry: uv run --no-python-downloads --script tools/check_strings.py
        files: ^custom_components/stiebel_eltron_ir/(strings\.json|translations/en\.json)$
        pass_filenames: false

      - id: signed-commits
        name: Every pushed commit is signed
        stages: [pre-push]
        language: system
        entry: uv run --no-python-downloads --script tools/check_signing.py commits
        pass_filenames: false
        always_run: true

      # The same comparison release.yaml makes before publishing. Running it here
      # too is what keeps a bad tag off the remote: caught locally it is one
      # `git tag -d`, caught in CI it has to be deleted in two places.
      - id: tags-match-manifest
        name: Version tags match manifest.json
        stages: [pre-push]
        language: system
        entry: uv run --no-python-downloads --script tools/check_versions.py tags
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Unit tests
        stages: [pre-push]
        language: system
        entry: uv run pytest -q
        pass_filenames: false
        always_run: true
